<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <script>
      // 表示の明るさ（ダーク／ライト／端末に合わせる）を、描画より前に決めてちらつきを防ぐ。詳しくは src/lib/theme.svelte.ts
      (function () {
        var t = 'dark';
        try {
          var v = localStorage.getItem('listenloop.theme');
          if (v === 'light' || v === 'auto') t = v;
        } catch (e) {}
        document.documentElement.dataset.theme = t;
        var light = t === 'light' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
        if (light) {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f6f3');
          document.querySelector('meta[name="color-scheme"]').setAttribute('content', 'light');
          // ホーム画面のアプリの上端（時計などの帯）を白地に黒文字にする。iPhone は起動時にしか読まないので、切り替えは次回の起動から
          document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'default');
        }
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ListenLoop" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>ListenLoop</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
